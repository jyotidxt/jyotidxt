<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4FA3"></stop>
      <stop offset="0.45" stop-color="#A855F7"></stop>
      <stop offset="1" stop-color="#4F7CFF"></stop>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.7"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"></feGaussianBlur>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-opacity="0.2"></feDropShadow>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="white" stroke-opacity="0.08"></path>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="32" fill="url(#bg)"></rect>

  <!-- Soft colorful blobs -->
  <circle cx="1050" cy="60" r="150" fill="#7DD3FC" opacity="0.35" filter="url(#blur)"></circle>
  <circle cx="160" cy="380" r="170" fill="#F9A8D4" opacity="0.35" filter="url(#blur)"></circle>
  <circle cx="700" cy="80" r="110" fill="#C4B5FD" opacity="0.3" filter="url(#blur)"></circle>

  <!-- Grid -->
  <rect width="1200" height="420" rx="32" fill="url(#grid)"></rect>

  <!-- Decorative glass shapes -->
  <rect x="850" y="-35" width="250" height="250" rx="55" transform="rotate(25 850 -35)" fill="white" fill-opacity="0.10" stroke="white" stroke-opacity="0.22"></rect>

  <rect x="950" y="235" width="170" height="170" rx="40" transform="rotate(-18 950 235)" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.18"></rect>

  <circle cx="1010" cy="125" r="58" fill="url(#glow)" fill-opacity="0.35"></circle>

  <!-- Small decorative dots -->
  <circle cx="80" cy="70" r="5" fill="white" fill-opacity="0.8"></circle>
  <circle cx="105" cy="70" r="5" fill="#FDE68A"></circle>
  <circle cx="130" cy="70" r="5" fill="#BFDBFE"></circle>

  <!-- Main text -->
  <text x="80" y="155" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">
    JYOTI DIXIT
  </text>

  <text x="84" y="202" fill="white" fill-opacity="0.92" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" letter-spacing="4">
    FULL-STACK  •  AI  •  BUILDER
  </text>

  <!-- Divider -->
  <rect x="84" y="235" width="115" height="4" rx="2" fill="white"></rect>

  <!-- Description -->
  <text x="84" y="285" fill="white" fill-opacity="0.88" font-family="Arial, Helvetica, sans-serif" font-size="18">
    Building modern web experiences
  </text>

  <text x="84" y="314" fill="white" fill-opacity="0.88" font-family="Arial, Helvetica, sans-serif" font-size="18">
    and experimenting with AI-powered products.
  </text>

  <!-- Status pill -->
  <g filter="url(#shadow)">
    <rect x="84" y="345" width="175" height="38" rx="19" fill="white" fill-opacity="0.16" stroke="white" stroke-opacity="0.25"></rect>
  </g>

  <circle cx="107" cy="364" r="5" fill="#BBF7D0"></circle>

  <text x="121" y="370" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">
    CURRENTLY BUILDING
  </text>

  <!-- Tiny star -->
  <path d="M1080 300L1085 314L1100 319L1085 324L1080 339L1075 324L1060 319L1075 314L1080 300Z" fill="white" fill-opacity="0.75"></path>

  <path d="M1140 100L1143 108L1151 111L1143 114L1140 122L1137 114L1129 111L1137 108L1140 100Z" fill="white" fill-opacity="0.6"></path>

</svg>